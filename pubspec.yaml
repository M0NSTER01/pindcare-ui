name: pindcare
description: "ArogyaLink - Rural Telemedicine App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # UI
  google_fonts: ^6.1.0
  lottie: ^3.0.0
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  percent_indicator: ^4.2.3

  # Networking (Backend Integration)
  dio: ^5.4.0
  socket_io_client: ^2.0.3+1

  # Local Storage (Offline-First)
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  flutter_secure_storage: ^9.0.0
  path_provider: ^2.1.3

  # Connectivity & Sync
  connectivity_plus: ^6.1.4

  # Navigation
  go_router: ^14.8.1

  # State Management
  flutter_riverpod: ^2.6.1

  # Maps & Location
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  geolocator: ^11.0.0

  # Permissions
  permission_handler: ^11.3.1

  # Camera & Image
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # Media
  just_audio: ^0.9.38
  video_player: ^2.8.3

  # Utils
  intl: ^0.20.2
  share_plus: ^10.1.4
  uuid: ^4.3.3
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

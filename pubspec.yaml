name: pindcare
description: "ArogyaLink - Rural Telemedicine App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # UI
  google_fonts: ^6.1.0
  lottie: ^3.0.0
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  percent_indicator: ^4.2.3
  
  # Camera & Image
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  
  # Local Storage (Offline-First)
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  flutter_secure_storage: ^9.0.0
  
  # Connectivity & Sync
  connectivity_plus: ^6.1.4
  
  # Navigation
  go_router: ^14.8.1
  
  # State Management
  flutter_riverpod: ^2.6.1
  
  # Maps & Location
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  geolocator: ^11.0.0
  
  # Video Call (WebRTC via flutter_webrtc)
  flutter_webrtc: ^0.9.47
  
  # Permissions
  permission_handler: ^11.3.1
  
  # Media
  record: ^6.0.0
  just_audio: ^0.9.38
  video_player: ^2.8.3
  file_picker: ^8.0.3
  mobile_scanner: ^5.1.1
  
  # Utils
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  share_plus: ^10.1.4
  path_provider: ^2.1.3
  uuid: ^4.3.3

  # ── Backend Integration ──
  # Networking
  dio: ^5.4.0
  socket_io_client: ^2.0.3+1

  # Offline Map Tile Caching
  flutter_map_tile_caching: ^9.1.0

  # Notifications
  flutter_local_notifications: ^16.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
